
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ghana Open World</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#87ceeb;touch-action:none}
#game,canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.badge{background:#111d;color:white;padding:10px;border-radius:10px;font-size:12px;font-weight:bold}
#message{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:#111c;color:white;padding:10px;border-radius:10px;font-size:12px;white-space:nowrap}
#joystick{position:absolute;left:20px;bottom:20px;width:120px;height:120px;border-radius:50%;background:#ffffff30;border:2px solid #ffffff80;touch-action:none}
#stick{position:absolute;left:33px;top:33px;width:50px;height:50px;border-radius:50%;background:#ffffffd9;pointer-events:none}
#buttons{position:absolute;right:16px;bottom:22px;display:flex;gap:8px}
.gameButton{width:62px;height:62px;border:0;border-radius:50%;background:#111d;color:white;font-weight:bold;touch-action:manipulation}
#mission{position:absolute;right:18px;bottom:96px;padding:12px;border:0;border-radius:10px;background:#ffd342;font-weight:bold}
</style>
</head>
<body>
<div id="game">
<canvas id="canvas"></canvas>
<div id="hud">
<div class="badge">🇬🇭 GHANA OPEN WORLD</div>
<div class="badge" id="money">$500</div>
</div>
<div id="message">Loading your 3D world...</div>
<div id="joystick"><div id="stick"></div></div>
<button id="mission">START MISSION</button>
<div id="buttons">
<button class="gameButton" id="jump">JUMP</button>
<button class="gameButton" id="action">ACTION</button>
</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/loaders/GLTFLoader.js";

const canvas = document.getElementById("canvas");
const renderer = new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8bc9ef);
scene.fog = new THREE.Fog(0x8bc9ef,100,420);

const camera = new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,800);

scene.add(new THREE.HemisphereLight(0xe6f5ff,0x53613c,2));

const sun = new THREE.DirectionalLight(0xffedcf,3);
sun.position.set(80,120,60);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-100;
sun.shadow.camera.right=100;
sun.shadow.camera.top=100;
sun.shadow.camera.bottom=-100;
scene.add(sun);

function material(color,roughness=.85){
 return new THREE.MeshStandardMaterial({color,roughness});
}

const grass = material(0x548847);
const roadMat = material(0x30343a);
const pavement = material(0xb7b4a8);
const glass = new THREE.MeshStandardMaterial({color:0x65b8d8,roughness:.25,metalness:.1});
const yellow = material(0xf5ce49);

function block(w,h,d,x,y,z,mat,shadows=true){
 const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
 mesh.position.set(x,y,z);
 mesh.castShadow=shadows;
 mesh.receiveShadow=true;
 scene.add(mesh);
 return mesh;
}

const ground = new THREE.Mesh(new THREE.PlaneGeometry(600,600),grass);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// Roads and pavements
block(24,.08,600,0,.04,0,roadMat,false);
block(600,.08,24,0,.04,0,roadMat,false);
block(16,.08,600,-115,.04,0,roadMat,false);
block(16,.08,600,115,.04,0,roadMat,false);
block(600,.08,16,0,.04,-115,roadMat,false);
block(600,.08,16,0,.04,115,roadMat,false);

for(const z of [-15,15]){
 block(600,.12,3,0,.08,z,pavement,false);
}
for(const x of [-15,15]){
 block(3,.12,600,x,.08,0,pavement,false);
}

for(let x=-280;x<290;x+=22){
 block(8,.025,.28,x,.10,0,yellow,false);
 block(6,.025,.22,x,.10,-115,yellow,false);
 block(6,.025,.22,x,.10,115,yellow,false);
}
for(let z=-280;z<290;z+=22){
 block(.28,.025,8,0,.10,z,yellow,false);
}

// City buildings
const buildingColors=[0xd7c3a2,0xc8c5bd,0xe2d5bd,0xc2b0a0,0xd8d0bd,0xaaaeb3];

function makeBuilding(x,z,w,h,d,color){
 block(w,h,d,x,h/2,z,material(color));
 block(w+.5,.5,d+.5,x,h+.25,z,material(0x774a36),false);

 const front=z-d/2-.04;
 const rows=Math.floor((h-4)/4);
 const cols=Math.max(2,Math.floor(w/4));

 for(let r=0;r<rows;r++){
  for(let c=0;c<cols;c++){
   const wx=x-w/2+2+(c+.5)*(w-4)/cols;
   const wy=3+r*4;
   if(wy<h-1){
    block(1.25,1.5,.08,wx,wy,front,glass,false);
   }
  }
 }
 block(Math.min(4,w*.35),2,.15,x,1,z-d/2-.12,material(0x604a37),false);
}

const buildings=[
 [-48,-48,26,20,25], [48,-48,30,34,25],
 [-48,48,28,24,28], [48,48,25,30,26],
 [-155,-45,28,40,28], [155,-45,30,33,28],
 [-155,45,25,28,26], [155,45,32,42,28],
 [-48,-160,28,28,25], [48,-160,26,38,25],
 [-48,160,30,34,26], [48,160,28,25,26],
 [-205,-100,22,20,25], [205,100,26,27,25],
 [-200,100,24,32,25], [200,-100,25,35,25]
];

for(const b of buildings){
 makeBuilding(...b.slice(0,5),buildingColors[Math.floor(Math.random()*buildingColors.length)]);
}

// Palm-like roadside trees
function makeTree(x,z){
 const trunk= new THREE.Mesh(
  new THREE.CylinderGeometry(.35,.55,4,8),
  material(0x76502e)
 );
 trunk.position.set(x,2,z);
 trunk.castShadow=true;
 scene.add(trunk);

 for(let i=0;i<5;i++){
  const leaves=new THREE.Mesh(
   new THREE.ConeGeometry(2.5,5,7),
   material(i%2?0x286b31:0x347c37)
  );
  leaves.position.set(x+Math.sin(i*1.25)*1.3,5.1,z+Math.cos(i*1.25)*1.3);
  leaves.rotation.z=Math.sin(i)*.2;
  leaves.castShadow=true;
  scene.add(leaves);
 }
}
for(let x=-260;x<=260;x+=32){
 makeTree(x,-25);
 makeTree(x,25);
}

// Streetlights
function streetLight(x,z){
 block(.18,6,.18,x,3,z,material(0x303030),false);
 block(1.5,.12,.12,x+.6,5.8,z,material(0x303030),false);
 const lamp=new THREE.Mesh(
  new THREE.SphereGeometry(.28,8,8),
  new THREE.MeshBasicMaterial({color:0xffedaf})
 );
 lamp.position.set(x+1.25,5.7,z);
 scene.add(lamp);
}
for(let z=-220;z<=220;z+=55){
 streetLight(-17,z);
 streetLight(17,z);
}

// Decorative vehicles
function makeCar(x,z,color){
 const car=new THREE.Group();
 car.position.set(x,.5,z);

 const body=new THREE.Mesh(new THREE.BoxGeometry(4.5,1.1,2.2),material(color,.45));
 body.castShadow=true;
 car.add(body);

 const cabin=new THREE.Mesh(new THREE.BoxGeometry(2.5,1,1.8),glass);
 cabin.position.set(-.2,.9,0);
 car.add(cabin);

 const wheelMat=material(0x171717,.95);
 for(const wx of [-1.4,1.4]){
  for(const wz of [-1.05,1.05]){
   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.48,.48,.28,12),
    wheelMat
   );
   wheel.rotation.x=Math.PI/2;
   wheel.position.set(wx,-.35,wz);
   car.add(wheel);
  }
 }
 scene.add(car);
 return car;
}
makeCar(-35,-7,0xc62f2f);
makeCar(35,7,0x1b63c9);
makeCar(-7,42,0xe7b52b);

// Player root and fallback character
const player=new THREE.Group();
scene.add(player);
player.position.set(0,0,15);

function makeFallback(){
 const person=new THREE.Group();
 const skin=material(0x9a603c);
 const shirt=material(0x205a9b);
 const trousers=material(0x222633);
 const torso=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.5,.55),shirt);
 torso.position.y=1.85;
 person.add(torso);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.36,16,12),skin);
 head.position.y=2.9;
 person.add(head);
 for(const x of [-.3,.3]){
  const leg=new THREE.Mesh(new THREE.BoxGeometry(.36,1,.4),trousers);
  leg.position.set(x,.6,0);
  person.add(leg);
 }
 for(const x of [-.75,.75]){
  const arm=new THREE.Mesh(new THREE.BoxGeometry(.3,1.15,.3),skin);
  arm.position.set(x,1.9,0);
  person.add(arm);
 }
 return person;
}

let model=null;
let mixer=null;
let idleAction=null;
let walkAction=null;
let activeAction=null;
let modelReady=false;

function switchAnimation(next){
 if(!next || next===activeAction)return;
 next.reset().play();
 if(activeAction)activeAction.crossFadeTo(next,.2,false);
 activeAction=next;
}

const loader=new GLTFLoader();
loader.load(
 "https://threejs.org/examples/models/gltf/Soldier.glb",
 gltf=>{
  model=gltf.scene;
  model.scale.setScalar(1.65);
  model.traverse(o=>{
   if(o.isMesh){
    o.castShadow=true;
    o.receiveShadow=true;
   }
  });
  player.add(model);

  mixer=new THREE.AnimationMixer(model);
  for(const clip of gltf.animations){
   const name=clip.name.toLowerCase();
   const action=mixer.clipAction(clip);
   if(name.includes("idle"))idleAction=action;
   if(name.includes("walk")||name.includes("run"))walkAction=action;
  }
  activeAction=idleAction||gltf.animations[0]&&mixer.clipAction(gltf.animations[0]);
  if(activeAction)activeAction.play();
  modelReady=true;
  document.getElementById("message").textContent="Welcome! Explore the city.";
 },
 undefined,
 error=>{
  console.error("Character model failed to load",error);
  player.add(makeFallback());
  document.getElementById("message").textContent="Explore the city";
 }
);

// Mission marker
const marker=new THREE.Mesh(
 new THREE.TorusGeometry(2.5,.3,10,28),
 new THREE.MeshBasicMaterial({color:0x168cff})
);
marker.rotation.x=Math.PI/2;
marker.position.set(48,.3,-48);
scene.add(marker);

let mission=false;
document.getElementById("mission").onclick=()=>{
 mission=!mission;
 document.getElementById("mission").textContent=mission?"MISSION ACTIVE":"START MISSION";
 document.getElementById("message").textContent=mission?"Reach the glowing blue marker!":"Explore the city";
};

// Touch joystick
const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
let joyX=0,joyY=0,joyActive=false;

function moveStick(e){
 const r=joystick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 const max=38;
 const length=Math.hypot(dx,dy);
 if(length>max){dx=dx/length*max;dy=dy/length*max;}
 joyX=dx/max;
 joyY=dy/max;
 stick.style.transform=`translate(${dx}px,${dy}px)`;
}
joystick.addEventListener("pointerdown",e=>{
 joyActive=true;
 joystick.setPointerCapture(e.pointerId);
 moveStick(e);
});
joystick.addEventListener("pointermove",e=>{if(joyActive)moveStick(e);});
function resetStick(){
 joyActive=false;joyX=0;joyY=0;
 stick.style.transform="translate(0,0)";
}
joystick.addEventListener("pointerup",resetStick);
joystick.addEventListener("pointercancel",resetStick);

// Keyboard controls
const keys={};
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;});
addEventListener("keyup",e=>{keys[e.key.toLowerCase()]=false;});

let verticalSpeed=0;
let onGround=true;
document.getElementById("jump").onclick=()=>{
 if(onGround){
  verticalSpeed=.22;
  onGround=false;
 }
};
document.getElementById("action").onclick=()=>{
 const distance=player.position.distanceTo(marker.position);
 document.getElementById("message").textContent=
  distance<8?"Mission point reached! Well done!":"You looked around. Keep exploring!";
};

const clock=new THREE.Clock();
let moving=false;

function update(dt){
 let forward=-joyY;
 let side=joyX;

 if(keys.w||keys.arrowup)forward=1;
 if(keys.s||keys.arrowdown)forward=-1;
 if(keys.a||keys.arrowleft)side=-1;
 if(keys.d||keys.arrowright)side=1;

 moving=forward!==0||side!==0;

 if(moving){
  const length=Math.hypot(forward,side)||1;
  forward/=length;side/=length;
  const speed=8*dt;
  player.position.z+=forward*speed;
  player.position.x+=side*speed;
  player.rotation.y=Math.atan2(side,forward);
 }

 player.position.x=THREE.MathUtils.clamp(player.position.x,-275,275);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-275,275);

 if(mixer){
  mixer.update(dt);
  switchAnimation(moving?(walkAction||idleAction):idleAction);
 }

 if(!onGround||verticalSpeed>0){
  player.position.y+=verticalSpeed;
  verticalSpeed-=.012;
  if(player.position.y<=0){
   player.position.y=0;
   verticalSpeed=0;
   onGround=true;
  }
 }

 if(mission && player.position.distanceTo(marker.position)<5){
  mission=false;
  document.getElementById("mission").textContent="START MISSION";
  document.getElementById("message").textContent="Mission completed! +$100";
  document.getElementById("money").textContent="$600";
 }
}

function followCamera(dt){
 const behind=new THREE.Vector3(
  -Math.sin(player.rotation.y)*10,
  6,
  -Math.cos(player.rotation.y)*10
 );
 const desired=player.position.clone().add(behind);
 camera.position.lerp(desired,1-Math.exp(-4*dt));
 camera.lookAt(player.position.x,player.position.y+1.8,player.position.z);
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);
 update(dt);
 marker.rotation.z+=dt*.8;
 followCamera(dt);
 renderer.render(scene,camera);
}
camera.position.set(0,7,25);
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});
</script>
</body>
</html>
