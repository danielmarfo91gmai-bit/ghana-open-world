<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Ghana Open World</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#87ceeb;
  font-family:Arial,sans-serif;
  touch-action:none
}

#game{
  position:fixed;
  inset:0
}

canvas{
  display:block;
  width:100%;
  height:100%
}

#hud{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  pointer-events:none
}

.badge{
  background:rgba(0,0,0,.72);
  color:white;
  padding:10px 13px;
  border-radius:12px;
  font-weight:bold;
  font-size:14px
}

#message{
  position:absolute;
  top:64px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.68);
  color:white;
  padding:9px 15px;
  border-radius:10px;
  font-size:13px;
  white-space:nowrap
}

#joystick{
  position:absolute;
  left:20px;
  bottom:20px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  border:2px solid rgba(255,255,255,.4)
}

#stick{
  position:absolute;
  left:36px;
  top:36px;
  width:50px;
  height:50px;
  border-radius:50%;
  background:rgba(255,255,255,.8)
}

#buttons{
  position:absolute;
  right:18px;
  bottom:20px;
  display:flex;
  gap:10px
}

.gameButton{
  width:65px;
  height:65px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.7);
  color:white;
  font-weight:bold
}

#mission{
  position:absolute;
  right:20px;
  bottom:95px;
  width:125px;
  height:42px;
  border:0;
  border-radius:12px;
  background:#f4c542;
  font-weight:bold
}
</style>
</head>

<body>

<div id="game">

<canvas id="canvas"></canvas>

<div id="hud">
  <div class="badge">🇬🇭 GHANA OPEN WORLD</div>
  <div class="badge" id="money">$500</div>
</div>

<div id="message">Explore the city</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<button id="mission">START MISSION</button>

<div id="buttons">
  <button class="gameButton" id="jump">JUMP</button>
  <button class="gameButton" id="action">ACTION</button>
</div>

</div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
  }
}
</script>

<script type="module">

import * as THREE from "three";


/* =========================
   ENGINE
========================= */

const canvas=document.getElementById("canvas");

const renderer=new THREE.WebGLRenderer({
  canvas,
  antialias:true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;


/* =========================
   WORLD
========================= */

const scene=new THREE.Scene();

scene.background=
  new THREE.Color(0x87ceeb);

scene.fog=
  new THREE.Fog(
    0x87ceeb,
    120,
    450
  );


/* =========================
   CAMERA
========================= */

const camera=
  new THREE.PerspectiveCamera(
    60,
    innerWidth/innerHeight,
    .1,
    1000
  );


/* =========================
   LIGHTING
========================= */

const hemi=
  new THREE.HemisphereLight(
    0xffffff,
    0x526b42,
    2.2
  );

scene.add(hemi);

const sun=
  new THREE.DirectionalLight(
    0xffffff,
    3
  );

sun.position.set(
  120,
  180,
  100
);

sun.castShadow=true;

sun.shadow.mapSize.set(
  2048,
  2048
);

sun.shadow.camera.left=-200;
sun.shadow.camera.right=200;
sun.shadow.camera.top=200;
sun.shadow.camera.bottom=-200;

scene.add(sun);


/* =========================
   MATERIAL HELPERS
========================= */

function mat(color){
  return new THREE.MeshStandardMaterial({
    color,
    roughness:.8
  });
}

const grassMat=mat(0x4c8745);
const roadMat=mat(0x292d32);
const sidewalkMat=mat(0x999999);
const concreteMat=mat(0xc5b7a3);
const roofMat=mat(0x713b2b);
const glassMat=new THREE.MeshStandardMaterial({
  color:0x6bb5d9,
  metalness:.2,
  roughness:.25
});

const treeMat=mat(0x236b32);
const trunkMat=mat(0x70462d);
const yellowMat=mat(0xf2c84b);


/* =========================
   GROUND
========================= */

const ground=
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      600,
      600
    ),
    grassMat
  );

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;

scene.add(ground);


/* =========================
   ROADS
========================= */

function road(x,z,w,d){

  const r=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,
        .08,
        d
      ),
      roadMat
    );

  r.position.set(
    x,
    .04,
    z
  );

  r.receiveShadow=true;

  scene.add(r);

  /* sidewalks */

  if(w>d){

    sidewalk(
      x,
      z-d/2-2,
      w,
      3
    );

    sidewalk(
      x,
      z+d/2+2,
      w,
      3
    );

  }else{

    sidewalk(
      x-w/2-2,
      z,
      3,
      d
    );

    sidewalk(
      x+w/2+2,
      z,
      3,
      d
    );

  }

}

function sidewalk(
  x,z,w,d
){

  const s=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,
        .12,
        d
      ),
      sidewalkMat
    );

  s.position.set(
    x,
    .08,
    z
  );

  scene.add(s);
}


road(0,0,26,600);
road(0,0,600,26);

road(-120,0,18,600);
road(120,0,18,600);

road(0,-120,600,18);
road(0,120,600,18);


/* =========================
   ROAD LINES
========================= */

function line(x,z,w,d){

  const l=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,.12,d
      ),
      yellowMat
    );

  l.position.set(
    x,.13,z
  );

  scene.add(l);
}


for(let x=-280;x<=280;x+=28){

  line(x,0,12,.6);

  line(x,-120,8,.5);
  line(x,120,8,.5);
}

for(let z=-280;z<=280;z+=28){

  line(0,z,.6,12);

  line(-120,z,.5,8);
  line(120,z,.5,8);
}


/* =========================
   WINDOWS
========================= */

function windowBox(
  x,y,z,w,h,d
){

  const win=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,h,d
      ),
      glassMat
    );

  win.position.set(
    x,y,z
  );

  scene.add(win);
}


/* =========================
   BUILDINGS
========================= */

function building(
  x,z,w,h,d
){

  const b=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,h,d
      ),
      concreteMat
    );

  b.position.set(
    x,h/2,z
  );

  b.castShadow=true;
  b.receiveShadow=true;

  scene.add(b);


  const roof=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w+1,
        .8,
        d+1
      ),
      roofMat
    );

  roof.position.set(
    x,
    h+.4,
    z
  );

  roof.castShadow=true;

  scene.add(roof);


  /* windows on front */

  const rows=
    Math.max(
      2,
      Math.floor(h/5)
    );

  const columns=
    Math.max(
      2,
      Math.floor(w/5)
    );

  for(
    let r=0;
    r<rows;
    r++
  ){

    for(
      let c=0;
      c<columns;
      c++
    ){

      const wx=
        x-w/2+3+
        c*(w-6)/
        Math.max(1,columns-1);

      const wy=
        3+r*5;

      if(wy<h-2){

        windowBox(
          wx,
          wy,
          z-d/2-.04,
          1.4,
          1.8,
          .08
        );

      }

    }

  }

}


/* city */

const city=[

[-55,-55,32,30,30],
[55,-55,38,45,30],
[-55,55,35,25,35],
[55,55,30,38,30],

[-160,-60,35,55,35],
[160,-60,38,42,35],
[-160,60,30,35,30],
[160,60,40,50,35],

[-55,-175,38,35,30],
[55,-175,30,50,35],
[-55,175,40,45,30],
[55,175,35,32,35]

];

for(const b of city){
  building(...b);
}


/* =========================
   TREES
========================= */

function tree(x,z){

  const trunk=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .7,
        .9,
        4,
        10
      ),
      trunkMat
    );

  trunk.position.set(
    x,
    2,
    z
  );

  trunk.castShadow=true;

  scene.add(trunk);


  const crown=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        4.2,
        16,
        12
      ),
      treeMat
    );

  crown.position.set(
    x,
    6,
    z
  );

  crown.castShadow=true;

  scene.add(crown);

}


/* trees */

for(
  let x=-240;
  x<=240;
  x+=40
){

  tree(x,-38);
  tree(x,38);

}


/* =========================
   STREET LIGHTS
========================= */

function streetLight(x,z){

  const pole=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .15,
        .2,
        7,
        8
      ),
      mat(0x333333)
    );

  pole.position.set(
    x,
    3.5,
    z
  );

  pole.castShadow=true;

  scene.add(pole);


  const lamp=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .45,
        10,
        10
      ),
      new THREE.MeshBasicMaterial({
        color:0xffe6a3
      })
    );

  lamp.position.set(
    x,
    7,
    z
  );

  scene.add(lamp);

}


for(
  let z=-240;
  z<=240;
  z+=60
){

  streetLight(
    -15,
    z
  );

  streetLight(
    15,
    z
  );

}


/* =========================
   CAR
========================= */

function makeCar(
  x,z,color
){

  const car=
    new THREE.Group();

  car.position.set(
    x,.5,z
  );


  const body=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        5,
        1.1,
        2.5
      ),
      mat(color)
    );

  body.castShadow=true;

  car.add(body);


  const cabin=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2.6,
        1.1,
        2
      ),
      glassMat
    );

  cabin.position.y=.9;

  cabin.castShadow=true;

  car.add(cabin);


  const wheelMat=mat(0x151515);

  for(
    const wx of [-1.8,1.8]
  ){

    for(
      const wz of [-1.15,1.15]
    ){

      const wheel=
        new THREE.Mesh(
          new THREE.CylinderGeometry(
            .55,
            .55,
            .35,
            12
          ),
          wheelMat
        );

      wheel.rotation.z=
        Math.PI/2;

      wheel.position.set(
        wx,
        -.45,
        wz
      );

      car.add(wheel);

    }

  }

  scene.add(car);

}


/* cars */

makeCar(
  -35,
  -8,
  0xd73535
);

makeCar(
  35,
  8,
  0x1e6dd6
);

makeCar(
  -8,
  45,
  0xf0bd2f
);


/* =========================
   PLAYER
========================= */

const player=
  new THREE.Group();

scene.add(player);


/* torso */

const torso=
  new THREE.Mesh(
    new THREE.BoxGeometry(
      1.5,
      2.3,
      1
    ),
    mat(0x254a73)
  );

torso.position.y=2.3;
torso.castShadow=true;

player.add(torso);


/* head */

const head=
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .68,
      20,
      20
    ),
    mat(0xb8794c)
  );

head.position.y=4;
head.castShadow=true;

player.add(head);


/* hair */

const hair=
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .7,
      16,
      16
    ),
    mat(0x18120f)
  );

hair.scale.y=.5;
hair.position.y=4.48;

player.add(hair);


/* legs */

function leg(x){

  const l=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .55,
        1.9,
        .65
      ),
      mat(0x171c29)
    );

  l.position.set(
    x,
    .95,
    0
  );

  l.castShadow=true;

  player.add(l);

}

leg(-.45);
leg(.45);


/* arms */

function arm(x){

  const a=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .45,
        1.9,
        .45
      ),
      mat(0xb8794c)
    );

  a.position.set(
    x,
    2.25,
    0
  );

  a.rotation.z=
    x<0 ? -.12 : .12;

  a.castShadow=true;

  player.add(a);

}

arm(-1);
arm(1);


player.position.set(
  0,
  0,
  15
);


/* =========================
   CAMERA
========================= */

camera.position.set(
  0,
  8,
  13
);


/* =========================
   CONTROLS
========================= */

let joyX=0;
let joyY=0;
let active=false;

const joystick=
  document.getElementById(
    "joystick"
  );

const stick=
  document.getElementById(
    "stick"
  );


function moveJoystick(e){

  const r=
    joystick.getBoundingClientRect();

  let dx=
    e.clientX-
    (r.left+r.width/2);

  let dy=
    e.clientY-
    (r.top+r.height/2);

  const max=42;

  const distance=
    Math.sqrt(
      dx*dx+dy*dy
    );

  if(distance>max){

    dx=
      dx/distance*max;

    dy=
      dy/distance*max;

  }

  joyX=dx/max;
  joyY=dy/max;

  stick.style.transform=
    `translate(${dx}px,${dy}px)`;

}


joystick.addEventListener(
  "pointerdown",
  e=>{

    active=true;

    joystick.setPointerCapture(
      e.pointerId
    );

    moveJoystick(e);

  }
);


joystick.addEventListener(
  "pointermove",
  e=>{

    if(active)
      moveJoystick(e);

  }
);


joystick.addEventListener(
  "pointerup",
  resetJoystick
);

joystick.addEventListener(
  "pointercancel",
  resetJoystick
);


function resetJoystick(){

  active=false;

  joyX=0;
  joyY=0;

  stick.style.transform=
    "translate(0,0)";
}


/* =========================
   KEYBOARD
========================= */

const keys={};

addEventListener(
  "keydown",
  e=>{
    keys[
      e.key.toLowerCase()
    ]=true;
  }
);

addEventListener(
  "keyup",
  e=>{
    keys[
      e.key.toLowerCase()
    ]=false;
  }
);


/* =========================
   MOVEMENT
========================= */

function update(){

  let forward=-joyY;
  let side=joyX;

  if(
    keys.w ||
    keys.arrowup
  ) forward=1;

  if(
    keys.s ||
    keys.arrowdown
  ) forward=-1;

  if(
    keys.a ||
    keys.arrowleft
  ) side=-1;

  if(
    keys.d ||
    keys.arrowright
  ) side=1;


  if(
    forward!==0 ||
    side!==0
  ){

    const len=
      Math.sqrt(
        forward*forward+
        side*side
      );

    forward/=len;
    side/=len;


    const speed=.22;

    player.position.z+=
      forward*speed;

    player.position.x+=
      side*speed;


    player.rotation.y=
      Math.atan2(
        side,
        forward
      );

  }


  player.position.x=
    THREE.MathUtils.clamp(
      player.position.x,
      -275,
      275
    );

  player.position.z=
    THREE.MathUtils.clamp(
      player.position.z,
      -275,
      275
    );

}


/* =========================
   JUMP
========================= */

let jumping=false;

document
.getElementById("jump")
.addEventListener(
  "click",
  ()=>{

    if(jumping)return;

    jumping=true;

    let t=0;

    function jumpLoop(){

      t+=.07;

      player.position.y=
        Math.sin(t*Math.PI)*3;

      if(t<1){

        requestAnimationFrame(
          jumpLoop
        );

      }else{

        player.position.y=0;
        jumping=false;

      }

    }

    jumpLoop();

  }
);


/* =========================
   ACTION
========================= */

document
.getElementById("action")
.addEventListener(
  "click",
  ()=>{

    document
    .getElementById(
      "message"
    )
    .textContent=
      "You interacted with the world!";

    setTimeout(
      ()=>{

        document
        .getElementById(
          "message"
        )
        .textContent=
          "Explore the city";

      },
      1600
    );

  }
);


/* =========================
   MISSION
========================= */

const marker=
  new THREE.Mesh(
    new THREE.TorusGeometry(
      3,
      .35,
      12,
      32
    ),
    new THREE.MeshBasicMaterial({
      color:0x168cff
    })
  );

marker.rotation.x=
  Math.PI/2;

marker.position.set(
  55,
  .25,
  -55
);

scene.add(marker);


let mission=false;

document
.getElementById("mission")
.addEventListener(
  "click",
  ()=>{

    mission=!mission;

    document
    .getElementById(
      "mission"
    )
    .textContent=
      mission
      ?"MISSION ACTIVE"
      :"START MISSION";

    document
    .getElementById(
      "message"
    )
    .textContent=
      mission
      ?"Reach the blue marker!"
      :"Explore the city";

  }
);


/* =========================
   CAMERA FOLLOW
========================= */

function cameraFollow(){

  const target=
    new THREE.Vector3(
      player.position.x,
      player.position.y+3,
      player.position.z
    );

  const desired=
    new THREE.Vector3(
      player.position.x-
      Math.sin(player.rotation.y)*10,
      player.position.y+7,
      player.position.z-
      Math.cos(player.rotation.y)*10
    );

  camera.position.lerp(
    desired,
    .08
  );

  camera.lookAt(
    target
  );

}


/* =========================
   RESIZE
========================= */

addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* =========================
   GAME LOOP
========================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  update();

  marker.rotation.z+=.025;

  cameraFollow();

  renderer.render(
    scene,
    camera
  );

}

animate();

</script>

</body>
</html>
