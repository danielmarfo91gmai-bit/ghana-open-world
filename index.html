
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ghana Open World</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial;background:#87ceeb;touch-action:none}
canvas{display:block;touch-action:none}
#hud{position:fixed;top:10px;left:10px;z-index:5;background:#101820df;color:white;padding:12px;border-radius:12px;font-size:13px}
#hud strong{color:#ffda45;font-size:17px}
#message{margin-top:5px;max-width:230px}
#help{position:fixed;right:10px;top:10px;z-index:5;background:#101820df;color:white;padding:8px;border-radius:8px;font-size:11px}
#controls{position:fixed;bottom:18px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:end;z-index:6;pointer-events:none}
#stick{width:125px;height:125px;border-radius:50%;background:#ffffff45;border:2px solid #ffffffbb;position:relative;pointer-events:auto;touch-action:none}
#knob{width:48px;height:48px;position:absolute;left:36px;top:36px;border-radius:50%;background:#ffffffdd;border:2px solid white}
#buttons{display:grid;grid-template-columns:62px 62px;gap:8px;pointer-events:auto}
button{height:58px;width:62px;border:2px solid #ffffffbb;border-radius:16px;background:#153653e8;color:white;font-size:10px;font-weight:bold;touch-action:none}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="hud">
<strong>GHANA OPEN WORLD 🇬🇭</strong>
<div id="message">Explore the city!</div>
<div>Money: GH₵ <span id="money">100</span></div>
</div>
<div id="help">Swipe screen to look around</div>
<div id="controls">
<div id="stick"><div id="knob"></div></div>
<div id="buttons">
<button id="jump">JUMP</button>
<button id="run">HOLD TO RUN</button>
<button id="mission">MISSION</button>
<button id="reset">RESET VIEW</button>
</div>
</div>

<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

// WORLD SETUP
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,150,520);

const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,900);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9efff,0x526044,2));
const sun=new THREE.DirectionalLight(0xffefcf,2.6);
sun.position.set(-60,100,45);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const grass=mat(0x57964a), asphalt=mat(0x34383c), yellow=mat(0xf4d35e), pavement=mat(0xb9b6ad);

function box(parent,w,h,d,x,y,z,m,cast=true){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
 o.position.set(x,y,z);o.castShadow=cast;o.receiveShadow=true;parent.add(o);return o;
}

// GROUND
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1000,1000),grass);
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// ROADS
function road(x,z,w,d){
 box(scene,w,.08,d,x,.04,z,asphalt,false);
 if(w>d){for(let p=x-w/2+4;p<x+w/2;p+=9)box(scene,3,.025,.15,p,.09,z,yellow,false);}
 else{for(let p=z-d/2+4;p<z+d/2;p+=9)box(scene,.15,.025,3,x,.09,p,yellow,false);}
}
road(0,0,600,14);
road(0,-100,14,600);
road(0,100,14,600);
road(-120,0,300,11);
road(120,0,300,11);
road(0,-200,400,9);
road(0,200,400,9);
road(-220,0,9,400);
road(220,0,9,400);

for(const z of [-9,9])box(scene,600,.12,2,0,.06,z,pavement,false);
for(const x of [-9,9])box(scene,2,.12,600,x,.06,0,pavement,false);

// BUILDINGS
const buildingColors=[0xd9c7a5,0xe4ded1,0xc8d2d7,0xc98c65,0xe5dfb4,0xd4c5e8];

function building(x,z,w,d,h,color){
 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 box(g,w,h,d,0,h/2,0,mat(color));
 box(g,w+.4,.25,d+.4,0,h+.12,0,mat(0x55565a));
 const win=mat(0x78c6dc,.25,.1);
 const rows=Math.floor((h-1)/3),cols=Math.max(1,Math.floor(w/2.7));
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  const wx=-w/2+1+(c+.5)*(w-2)/cols,wy=2+r*2.7;
  if(wy<h-.3){
   box(g,.8,1.15,.06,wx,wy,d/2+.04,win,false);
   box(g,.8,1.15,.06,wx,wy,-d/2-.04,win,false);
  }
 }
}
for(let x=-280;x<=280;x+=25){
 for(const z of [-28,28]){
  if(Math.abs(x)>18)building(x,z,15,14,8+Math.random()*24,buildingColors[Math.floor(Math.random()*buildingColors.length)]);
 }
}
for(let z=-275;z<=275;z+=25){
 for(const x of [-28,28]){
  if(Math.abs(z)>18)building(x,z,14,15,8+Math.random()*22,buildingColors[Math.floor(Math.random()*buildingColors.length)]);
 }
}

// TREES
function tree(x,z){
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.2,.32,2.5,8),mat(0x704725));
 trunk.position.set(x,1.25,z);trunk.castShadow=true;scene.add(trunk);
 const crown=new THREE.Mesh(new THREE.SphereGeometry(1.6,12,10),mat(0x247638));
 crown.position.set(x,3.2,z);crown.scale.y=1.2;crown.castShadow=true;scene.add(crown);
}
for(let i=0;i<180;i++){
 const x=(Math.random()-.5)*560,z=(Math.random()-.5)*560;
 if(Math.abs(x)>16&&Math.abs(z)>16)tree(x,z);
}

// STREET LIGHTS
function lamp(x,z){
 const pole=mat(0x30353a),light=mat(0xffedb0,.3);
 box(scene,.12,4,.12,x,2,z,pole);
 box(scene,1,.1,.12,x+.4,4,z,pole);
 box(scene,.35,.12,.35,x+.8,3.95,z,light);
}
for(let p=-280;p<=280;p+=28){
 lamp(p,-12);lamp(p,12);lamp(-12,p);lamp(12,p);
}

// DETAILED PROCEDURAL 3D CARS
function car(x,z,color,rotation=0){
 const g=new THREE.Group();g.position.set(x,.12,z);g.rotation.y=rotation;scene.add(g);
 const paint=mat(color,.3,.2),rubber=mat(0x17191c),glass=mat(0x80c4dc,.25,.2),chrome=mat(0xc5cbd0,.25,.7);
 box(g,4.3,.65,1.85,0,.65,0,paint);
 box(g,1.2,.22,1.8,1.35,.99,0,paint);
 box(g,2.25,.7,1.45,-.25,1.28,0,paint);
 box(g,1.1,.45,.06,.62,1.35,0,glass);
 box(g,.95,.42,.06,-1.03,1.35,0,glass);
 const wind=box(g,.07,.48,1.34,.82,1.28,0,glass);wind.rotation.z=-.3;
 const rear=box(g,.07,.43,1.32,-1.18,1.27,0,glass);rear.rotation.z=.3;
 for(const s of [-1,1]){
  box(g,.08,.65,.08,-.95,1.28,s*.75,paint);
  box(g,.08,.65,.08,.48,1.28,s*.75,paint);
  box(g,.28,.12,.15,.75,1.02,s*.98,paint);
  box(g,.3,.045,.04,-.15,.93,s*.94,chrome);
 }
 for(const wx of [-1.35,1.35])for(const wz of [-.94,.94]){
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.24,20),rubber);
  wheel.rotation.x=Math.PI/2;wheel.position.set(wx,.43,wz);wheel.castShadow=true;g.add(wheel);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.26,16),chrome);
  hub.rotation.x=Math.PI/2;hub.position.set(wx,.43,wz*1.02);g.add(hub);
 }
 for(const s of [-1,1]){
  box(g,.12,.2,.38,2.17,.72,s*.58,mat(0xfff0b5));
  box(g,.12,.2,.38,-2.17,.72,s*.58,mat(0xc91e27));
 }
 return g;
}
car(15,-17,0xc82d28,Math.PI/2);
car(-18,16,0xf4f4f4,-Math.PI/2);
car(35,0,0x176ac1,Math.PI/2);
car(-45,-70,0xe4ad26,0);
car(75,40,0x287b42,Math.PI/2);
car(-100,90,0xeeeeee,0);
car(150,-45,0xc82d28,Math.PI/2);

// PLAYER AND ANIMATIONS
const player=new THREE.Group();player.position.set(0,0,25);scene.add(player);
let mixer=null,idle=null,walk=null,run=null,active=null;

const fallback=new THREE.Group();player.add(fallback);
box(fallback,.72,1.05,.4,0,1.2,0,mat(0x1769d2));
const head=new THREE.Mesh(new THREE.SphereGeometry(.28,14,12),mat(0xc68b61));
head.position.y=1.95;fallback.add(head);
box(fallback,.24,.75,.25,-.2,.42,0,mat(0x242c45));
box(fallback,.24,.75,.25,.2,.42,0,mat(0x242c45));
box(fallback,.22,.72,.23,-.5,1.2,0,mat(0xc68b61));
box(fallback,.22,.72,.23,.5,1.2,0,mat(0xc68b61));

function animation(a){
 if(!a||a===active)return;
 if(active)active.fadeOut(.2);
 a.reset().fadeIn(.2).play();active=a;
}
new GLTFLoader().load("https://threejs.org/examples/models/gltf/Soldier.glb",g=>{
 player.remove(fallback);
 const model=g.scene;model.scale.setScalar(1.65);
 model.traverse(o=>{if(o.isMesh)o.castShadow=true;});
 player.add(model);mixer=new THREE.AnimationMixer(model);
 for(const clip of g.animations){
  const n=clip.name.toLowerCase(),a=mixer.clipAction(clip);
  if(n.includes("idle"))idle=a;
  if(n.includes("walk"))walk=a;
  if(n.includes("run"))run=a;
 }
 animation(idle);
},undefined,()=>{});

// CONTROLS
let mx=0,my=0,running=false,jumping=false,vy=0;
let yaw=0,pitch=.18;
const stick=document.getElementById("stick"),knob=document.getElementById("knob");
let stickId=null;

function joystick(e){
 const r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;
 const max=39,len=Math.hypot(dx,dy),k=len>max?max/len:1;
 const x=dx*k,y=dy*k;
 knob.style.left=(38+x)+"px";knob.style.top=(38+y)+"px";
 mx=x/max;my=y/max;
}
stick.addEventListener("pointerdown",e=>{e.preventDefault();stickId=e.pointerId;stick.setPointerCapture(e.pointerId);joystick(e);});
stick.addEventListener("pointermove",e=>{if(e.pointerId===stickId)joystick(e);});
function release(e){if(e.pointerId!==stickId)return;stickId=null;mx=my=0;knob.style.left="36px";knob.style.top="36px";}
stick.addEventListener("pointerup",release);stick.addEventListener("pointercancel",release);

const runButton=document.getElementById("run");
runButton.addEventListener("pointerdown",e=>{e.preventDefault();running=true;});
function stopRun(){running=false;}
runButton.addEventListener("pointerup",stopRun);
runButton.addEventListener("pointercancel",stopRun);
runButton.addEventListener("pointerleave",stopRun);

document.getElementById("jump").addEventListener("pointerdown",e=>{
 e.preventDefault();if(player.position.y<=.01){vy=7;jumping=true;}
});

// CAMERA: drag right to orbit right; drag left to orbit left
const canvas=renderer.domElement;
let lookId=null,lastX=0,lastY=0;
canvas.addEventListener("pointerdown",e=>{
 if(e.clientX>innerWidth*.4){
  lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;
  canvas.setPointerCapture(e.pointerId);
 }
});
canvas.addEventListener("pointermove",e=>{
 if(e.pointerId!==lookId)return;
 const dx=e.clientX-lastX,dy=e.clientY-lastY;
 yaw-=dx*.006;
 pitch=THREE.MathUtils.clamp(pitch-dy*.004,-.15,.75);
 lastX=e.clientX;lastY=e.clientY;
});
function endLook(e){if(e.pointerId===lookId)lookId=null;}
canvas.addEventListener("pointerup",endLook);
canvas.addEventListener("pointercancel",endLook);

document.getElementById("reset").addEventListener("click",()=>{yaw=0;pitch=.18;});

// MISSION
let money=100,done=false;
const marker=new THREE.Group();marker.position.set(0,0,-30);scene.add(marker);
const ring=new THREE.Mesh(new THREE.TorusGeometry(1.8,.16,12,32),mat(0xffd500,.3,.2));
ring.rotation.x=Math.PI/2;ring.position.y=.25;marker.add(ring);
const arrow=new THREE.Mesh(new THREE.ConeGeometry(.6,1.3,16),mat(0xffd500));
arrow.position.y=2.7;marker.add(arrow);
document.getElementById("mission").addEventListener("click",()=>{
 document.getElementById("message").textContent=done?"Mission complete! Keep exploring.":"Reach the golden marker to earn GH₵50!";
});

// GAME LOOP
const clock=new THREE.Clock();
function followCamera(dt){
 const distance=9,h=distance*Math.cos(pitch);
 const desired=new THREE.Vector3(
  player.position.x+Math.sin(yaw)*h,
  player.position.y+2.5+distance*Math.sin(pitch),
  player.position.z+Math.cos(yaw)*h
 );
 camera.position.lerp(desired,1-Math.exp(-7*dt));
 camera.lookAt(player.position.x,player.position.y+1.4,player.position.z);
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);
 const forward=-my,side=mx,len=Math.hypot(forward,side);

 if(len>.08){
  const f=forward/Math.max(1,len),s=side/Math.max(1,len);
  const dx=Math.sin(yaw)*f+Math.cos(yaw)*s;
  const dz=-Math.cos(yaw)*f+Math.sin(yaw)*s;
  const speed=running?9:5;
  player.position.x+=dx*speed*dt;
  player.position.z+=dz*speed*dt;
  player.rotation.y=Math.atan2(dx,-dz);
  animation(running?run:(walk||run));
 }else animation(idle);

 player.position.x=THREE.MathUtils.clamp(player.position.x,-285,285);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-285,285);

 if(jumping||player.position.y>0){
  vy-=18*dt;player.position.y+=vy*dt;
  if(player.position.y<=0){player.position.y=0;vy=0;jumping=false;}
 }
 if(mixer)mixer.update(dt);

 marker.rotation.y+=dt;
 marker.position.y=.12+Math.sin(performance.now()*.002)*.12;
 if(!done&&player.position.distanceTo(marker.position)<4){
  done=true;money+=50;
  document.getElementById("money").textContent=money;
  document.getElementById("message").textContent="Mission complete! You earned GH₵50!";
 }
 followCamera(dt);
 renderer.render(scene,camera);
}
followCamera(.016);animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
