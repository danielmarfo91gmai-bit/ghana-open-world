<script type="importmap">
{"imports":{

<script type="module">
import * as THREE from "three";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bcdf0);
scene.fog=new THREE.Fog(0x9bcdf0,100,430);

const camera=new THREE.PerspectiveCamera(
65,innerWidth/innerHeight,.1,900
);

const renderer=new THREE.WebGLRenderer({
antialias:true,
powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(
0xdff2ff,0x66503b,2.1
));

const sun=new THREE.DirectionalLight(0xfff1d8,3.1);
sun.position.set(-80,120,55);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-90;
sun.shadow.camera.right=90;
sun.shadow.camera.top=90;
sun.shadow.camera.bottom=-90;
scene.add(sun);

const mat=(c,r=.85,m=0)=>
new THREE.MeshStandardMaterial({
color:c,roughness:r,metalness:m
});

const asphalt=mat(0x30343a);
const grass=mat(0x668d4d);
const concrete=mat(0xb9b7ad);
const white=mat(0xf1e9cf);

const glass=new THREE.MeshPhysicalMaterial({
color:0x8dc9d8,
roughness:.18,
metalness:.18,
transparent:true,
opacity:.82
});

const worldColliders=[];

function meshBox(parent,w,h,d,material,x,y,z,cast=true){
const o=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),material
);
o.position.set(x,y,z);
o.castShadow=cast;
o.receiveShadow=true;
parent.add(o);
return o;
}

function ground(w,h,d,material,x,y,z){
return meshBox(scene,w,h,d,material,x,y,z,false);
}

// Large grassy world
ground(650,1,650,grass,0,-.56,0);

// Roads, pavements and lane markings
for(let p=-300;p<=300;p+=60){
ground(15,.12,620,asphalt,p,.02,0);
ground(620,.12,15,asphalt,0,.02,p);

ground(2,.18,620,concrete,p-9,.02,0);
ground(2,.18,620,concrete,p+9,.02,0);
ground(620,.18,2,concrete,0,.02,p-9);
ground(620,.18,2,concrete,0,.02,p+9);

for(let q=-300;q<=300;q+=13){
ground(.16,.025,4,white,p,.095,q);
ground(4,.025,.16,white,q,.095,p);
}
}


// ===== PART 2: CITY, TREES, STREETLIGHTS AND 3D CHARACTER =====

// Create city buildings with windows
let seed = 71321;

function rand() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}

const facade = [
  0xaaaeb5, 0x8d9ba8, 0xc5b8a5, 0x687b8b,
  0xb8b2a6, 0x87918c, 0xd0c7b9, 0x596b78
];

const windowMats = [
  new THREE.MeshStandardMaterial({
    color: 0x8bd3e8,
    emissive: 0x153746,
    roughness: 0.3,
    metalness: 0.35
  }),
  new THREE.MeshStandardMaterial({
    color: 0xffd78a,
    emissive: 0x6b4617,
    roughness: 0.3
  })
];

const buildingMaterial = color =>
  new THREE.MeshStandardMaterial({
    color,
    roughness: 0.82,
    metalness: 0.08
  });

for (let gx = -5; gx <= 5; gx++) {
  for (let gz = -5; gz <= 5; gz++) {
    if (Math.abs(gx) < 2 && Math.abs(gz) < 2) continue;

    const x = gx * 48 + (rand() - 0.5) * 9;
    const z = gz * 48 + (rand() - 0.5) * 9;
    const w = 17 + rand() * 13;
    const d = 17 + rand() * 13;
    const h = 13 + rand() * 65;

    const building = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      buildingMaterial(
        facade[Math.floor(rand() * facade.length)]
      )
    );

    building.position.set(x, h / 2, z);
    building.castShadow = true;
    building.receiveShadow = true;
    scene.add(building);

    // Flat rooftop
    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(w + 0.5, 0.5, d + 0.5),
      buildingMaterial(0x555d65)
    );
    roof.position.set(x, h + 0.25, z);
    scene.add(roof);

    // Rows of windows on the visible front and back
    const rows = Math.max(2, Math.floor(h / 4));
    const cols = Math.max(2, Math.floor(w / 3.5));

    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < cols; col++) {
        const wy = 2 + row * 3.2;
        if (wy > h - 1.5) continue;

        const wx = x - w / 2 + 1.8 + col * ((w - 3.6) / cols);

        for (const side of [-1, 1]) {
          const windowMesh = new THREE.Mesh(
            new THREE.BoxGeometry(1.25, 1.7, 0.12),
            windowMats[(gx + gz + row + col) & 1]
          );
          windowMesh.position.set(wx, wy, z + side * (d / 2 + 0.07));
          scene.add(windowMesh);
        }
      }
    }
  }
}

// Add trees around the city
const treeTrunkMat = buildingMaterial(0x67452c);
const treeLeafMats = [
  buildingMaterial(0x277747),
  buildingMaterial(0x38864a),
  buildingMaterial(0x4c914e)
];

for (let i = 0; i < 180; i++) {
  const x = (rand() - 0.5) * 520;
  const z = (rand() - 0.5) * 520;

  // Keep the main road areas clear
  if (Math.abs(x % 48) < 9 || Math.abs(z % 48) < 9) continue;

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.35, 0.55, 3.5, 7),
    treeTrunkMat
  );
  trunk.position.set(x, 1.75, z);
  trunk.castShadow = true;
  scene.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(2.5 + rand() * 1.5, 8, 7),
    treeLeafMats[Math.floor(rand() * treeLeafMats.length)]
  );
  leaves.position.set(x, 4.4, z);
  leaves.castShadow = true;
  scene.add(leaves);
}

// Streetlights along the roads
const poleMat = buildingMaterial(0x303942);
const lampMat = new THREE.MeshStandardMaterial({
  color: 0xfff0bd,
  emissive: 0xffcf6c,
  emissiveIntensity: 1.3
});

for (let p = -270; p <= 270; p += 36) {
  for (const side of [-1, 1]) {
    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.13, 0.18, 7, 7),
      poleMat
    );
    pole.position.set(p, 3.5, side * 8);
    scene.add(pole);

    const arm = new THREE.Mesh(
      new THREE.BoxGeometry(1.7, 0.12, 0.12),
      poleMat
    );
    arm.position.set(p + 0.7, 6.7, side * 8);
    scene.add(arm);

    const lamp = new THREE.Mesh(
      new THREE.BoxGeometry(0.8, 0.2, 0.45),
      lampMat
    );
    lamp.position.set(p + 1.3, 6.6, side * 8);
    scene.add(lamp);
  }
}

// Set up the player character.
// This tries to load a real animated 3D character model.
const player = new THREE.Group();
scene.add(player);

let character = null;
let mixer = null;
let actions = {};
let activeAction = null;
let characterReady = false;

const loader = new GLTFLoader();

function playAction(name) {
  if (!actions[name] || activeAction === actions[name]) return;

  if (activeAction) {
    activeAction.fadeOut(0.2);
  }

  activeAction = actions[name];
  activeAction.reset().fadeIn(0.2).play();
}

// Fallback character if the online 3D model cannot load
function createFallback() {
  const skin = new THREE.MeshStandardMaterial({
    color: 0x8d5737,
    roughness: 0.85
  });

  const shirt = new THREE.MeshStandardMaterial({
    color: 0x2378c9,
    roughness: 0.8
  });

  const trousers = new THREE.MeshStandardMaterial({
    color: 0x252e3a,
    roughness: 0.9
  });

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.75, 1.05, 0.42),
    shirt
  );
  body.position.y = 1.55;
  player.add(body);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.29, 16, 12),
    skin
  );
  head.position.y = 2.3;
  player.add(head);

  const leftLeg = new THREE.Mesh(
    new THREE.BoxGeometry(0.25, 0.85, 0.3),
    trousers
  );
  leftLeg.position.set(-0.2, 0.48, 0);
  player.add(leftLeg);

  const rightLeg = leftLeg.clone();
  rightLeg.position.x = 0.2;
  player.add(rightLeg);

  const leftArm = new THREE.Mesh(
    new THREE.BoxGeometry(0.22, 0.85, 0.25),
    shirt
  );
  leftArm.position.set(-0.52, 1.55, 0);
  player.add(leftArm);

  const rightArm = leftArm.clone();
  rightArm.position.x = 0.52;
  player.add(rightArm);

  character = player;
  characterReady = true;
}

// Load the animated 3D model from the Three.js examples
loader.load(
  "https://threejs.org/examples/models/gltf/Soldier.glb",
  function (gltf) {
    character = gltf.scene;
    character.scale.setScalar(1.05);
    character.position.y = 0;
    player.add(character);

    character.traverse(function (obj) {
      if (obj.isMesh) {
        obj.castShadow = true;
        obj.receiveShadow = true;
      }
    });

    mixer = new THREE.AnimationMixer(character);

    gltf.animations.forEach(function (clip) {
      actions[clip.name] = mixer.clipAction(clip);
    });

    const idleName = gltf.animations.some(a => a.name === "Idle")
      ? "Idle"
      : Object.keys(actions)[0];

    playAction(idleName);
    characterReady = true;
  },
  undefined,
  function (error) {
    console.warn("3D character model failed to load; using fallback.", error);
    createFallback();
  }
);

// ===== END OF PART 2 =====


// ===== PART 3: CARS AND DRIVING CONTROLS =====

const cars = [];

function makeCar(x, z, color, heading = 0) {
  const car = new THREE.Group();

  const paint = new THREE.MeshStandardMaterial({
    color: color,
    metalness: 0.45,
    roughness: 0.3
  });

  const dark = new THREE.MeshStandardMaterial({
    color: 0x202832,
    metalness: 0.15,
    roughness: 0.55
  });

  const glass = new THREE.MeshStandardMaterial({
    color: 0x7fc4dc,
    metalness: 0.45,
    roughness: 0.18
  });

  const rubber = new THREE.MeshStandardMaterial({
    color: 0x17191d,
    roughness: 0.95
  });

  const metal = new THREE.MeshStandardMaterial({
    color: 0xb9c4cc,
    metalness: 0.8,
    roughness: 0.25
  });

  // Main body and bonnet
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(2.15, 0.72, 4.3),
    paint
  );
  body.position.y = 0.85;
  body.castShadow = true;
  car.add(body);

  const bonnet = new THREE.Mesh(
    new THREE.BoxGeometry(2.05, 0.25, 1.15),
    paint
  );
  bonnet.position.set(0, 1.2, -1.35);
  car.add(bonnet);

  // Cabin and windows
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.65, 0.82, 2.05),
    paint
  );
  cabin.position.set(0, 1.52, 0.15);
  cabin.castShadow = true;
  car.add(cabin);

  const windshield = new THREE.Mesh(
    new THREE.BoxGeometry(1.48, 0.52, 0.07),
    glass
  );
  windshield.position.set(0, 1.55, -0.91);
  windshield.rotation.x = -0.18;
  car.add(windshield);

  const rearWindow = windshield.clone();
  rearWindow.position.z = 1.17;
  rearWindow.rotation.x = 0.18;
  car.add(rearWindow);

  // Front and rear lights
  for (const side of [-1, 1]) {
    const headlight = new THREE.Mesh(
      new THREE.BoxGeometry(0.42, 0.2, 0.08),
      new THREE.MeshStandardMaterial({
        color: 0xfff1bd,
        emissive: 0xffd47a,
        emissiveIntensity: 0.5
      })
    );
    headlight.position.set(side * 0.72, 0.98, -2.17);
    car.add(headlight);

    const taillight = new THREE.Mesh(
      new THREE.BoxGeometry(0.38, 0.2, 0.08),
      new THREE.MeshStandardMaterial({
        color: 0xe52b35,
        emissive: 0x6d0000
      })
    );
    taillight.position.set(side * 0.72, 0.98, 2.17);
    car.add(taillight);
  }

  // Four wheels and hubs
  const wheels = [];

  for (const wx of [-1.08, 1.08]) {
    for (const wz of [-1.35, 1.35]) {
      const wheel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.43, 0.43, 0.26, 16),
        rubber
      );

      wheel.rotation.z = Math.PI / 2;
      wheel.position.set(wx, 0.48, wz);
      wheel.castShadow = true;
      car.add(wheel);
      wheels.push(wheel);

      const hub = new THREE.Mesh(
        new THREE.CylinderGeometry(0.2, 0.2, 0.28, 12),
        metal
      );
      hub.rotation.z = Math.PI / 2;
      hub.position.copy(wheel.position);
      car.add(hub);
    }
  }

  car.position.set(x, 0, z);
  car.rotation.y = heading;
  scene.add(car);

  const vehicle = {
    group: car,
    wheels,
    speed: 0,
    heading,
    color
  };

  cars.push(vehicle);
  return vehicle;
}

// Cars placed around the city
makeCar(8, 5, 0xd92727, 0);
makeCar(-8, 5, 0x2467d8, Math.PI);
makeCar(5, -10, 0xf0bd27, Math.PI / 2);
makeCar(-10, -8, 0xeeeeee, -Math.PI / 2);
makeCar(22, 12, 0x278b50, 0);
makeCar(-22, 14, 0x6c43a0, Math.PI);
makeCar(14, -24, 0x252a30, Math.PI / 2);
makeCar(-16, -25, 0xe66d25, -Math.PI / 2);

// Player and driving state
let activeCar = null;
let yaw = 0;
let pitch = 0.18;
let jumpTime = 0;

const clock = new THREE.Clock();

const modeEl = document.getElementById("mode");
const enterBtn = document.getElementById("enter");
const exitBtn = document.getElementById("exit");
const gasBtn = document.getElementById("accelerate");
const brakeBtn = document.getElementById("brake");
function nearestCar() {
  let nearest = null;
  let bestDistance = 5.5;

  for (const car of cars) {
    const distance = player.position.distanceTo(car.group.position);

    if (distance < bestDistance) {
      bestDistance = distance;
      nearest = car;
    }
  }

  return nearest;
}

function enterCar() {
  if (activeCar) return;

  const car = nearestCar();

  if (!car) {
    modeEl.textContent = "Walk closer to a car";
    return;
  }

  activeCar = car;
  player.visible = false;
  activeCar.speed = 0;
  modeEl.textContent = "Driving";
  enterBtn.textContent = "Driving";
}

function exitCar() {
  if (!activeCar) return;

  const car = activeCar;
  const side = new THREE.Vector3(2.1, 0, 0);
  side.applyAxisAngle(new THREE.Vector3(0, 1, 0), car.heading);

  player.position.copy(car.group.position).add(side);
  player.position.y = 0;
  player.visible = true;

  yaw = car.heading;
  activeCar.speed = 0;
  activeCar = null;

  modeEl.textContent = "On foot";
  enterBtn.textContent = "Enter car";
}

enterBtn.addEventListener("click", function () {
  if (activeCar) {
    exitCar();
  } else {
    enterCar();
  }
});

exitBtn.addEventListener("click", exitCar);

// Touch and keyboard controls
const keys = {};

window.addEventListener("keydown", event => {
  keys[event.key.toLowerCase()] = true;

  if (event.key.toLowerCase() === "e") {
    if (activeCar) exitCar();
    else enterCar();
  }

  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) {
    event.preventDefault();
  }
});

window.addEventListener("keyup", event => {
  keys[event.key.toLowerCase()] = false;
});

let gasHeld = false;
let brakeHeld = false;

gasBtn.addEventListener("pointerdown", event => {
  event.preventDefault();
  gasHeld = true;
});

brakeBtn.addEventListener("pointerdown", event => {
  event.preventDefault();
  brakeHeld = true;
});

window.addEventListener("pointerup", () => {
  gasHeld = false;
  brakeHeld = false;
});

window.addEventListener("pointercancel", () => {
  gasHeld = false;
  brakeHeld = false;
});

// Mobile movement joystick
const joystick = document.getElementById("stick");
const stick = document.getElementById("nub");

let joyX = 0;
let joyY = 0;
let joyPointer = null;

joystick.addEventListener("pointerdown", event => {
  joyPointer = event.pointerId;
  joystick.setPointerCapture(event.pointerId);
});

joystick.addEventListener("pointermove", event => {
  if (joyPointer !== event.pointerId) return;

  const rect = joystick.getBoundingClientRect();
  const dx = event.clientX - (rect.left + rect.width / 2);
  const dy = event.clientY - (rect.top + rect.height / 2);
  const max = rect.width * 0.32;
  const length = Math.max(1, Math.hypot(dx, dy));
  const scale = Math.min(1, max / length);

  joyX = (dx * scale) / max;
  joyY = (dy * scale) / max;

  stick.style.transform =
    `translate(${joyX * max}px, ${joyY * max}px)`;
});

function resetJoystick() {
  joyX = 0;
  joyY = 0;
  joyPointer = null;
  stick.style.transform = "translate(0px, 0px)";
}

joystick.addEventListener("pointerup", resetJoystick);
joystick.addEventListener("pointercancel", resetJoystick);

// Camera dragging
let cameraPointer = null;
let lastPointerX = 0;
let lastPointerY = 0;

renderer.domElement.addEventListener("pointerdown", event => {
  cameraPointer = event.pointerId;
  lastPointerX = event.clientX;
  lastPointerY = event.clientY;
});

renderer.domElement.addEventListener("pointermove", event => {
  if (cameraPointer !== event.pointerId) return;

  const dx = event.clientX - lastPointerX;
  const dy = event.clientY - lastPointerY;

  yaw -= dx * 0.006;
  pitch = THREE.MathUtils.clamp(
    pitch + dy * 0.004,
    -0.05,
    0.85
  );

  lastPointerX = event.clientX;
  lastPointerY = event.clientY;
});

window.addEventListener("pointerup", () => {
  cameraPointer = null;
});

// ===== END OF PART 3 =====


// ===== PART 4: MOVEMENT, DRIVING, CAMERA AND GAME LOOP =====

function updatePlayer(delta) {
  const forwardInput =
    (keys["w"] || keys["arrowup"] ? 1 : 0) -
    (keys["s"] || keys["arrowdown"] ? 1 : 0) -
    joyY;

  const sideInput =
    (keys["d"] || keys["arrowright"] ? 1 : 0) -
    (keys["a"] || keys["arrowleft"] ? 1 : 0) +
    joyX;

  if (activeCar) {
    const car = activeCar;

    const accelerating = gasHeld || keys["w"] || keys["arrowup"];
    const reversing = brakeHeld || keys["s"] || keys["arrowdown"];

    if (accelerating) car.speed = Math.min(car.speed + 13 * delta, 30);
    else if (reversing) car.speed = Math.max(car.speed - 18 * delta, -10);
    else car.speed *= Math.pow(0.94, delta * 60);

    const steering = sideInput;

    if (Math.abs(car.speed) > 0.15) {
      car.heading -= steering * delta * 1.5 *
        Math.sign(car.speed);
    }

    const oldPosition = car.group.position.clone();

    car.group.position.x -= Math.sin(car.heading) * car.speed * delta;
    car.group.position.z -= Math.cos(car.heading) * car.speed * delta;

    // Keep the car inside the playable area
    car.group.position.x = THREE.MathUtils.clamp(
      car.group.position.x, -295, 295
    );
    car.group.position.z = THREE.MathUtils.clamp(
      car.group.position.z, -295, 295
    );

    car.group.rotation.y = car.heading;

    for (const wheel of car.wheels) {
      wheel.rotation.x += car.speed * delta * 1.8;
    }

    // Basic collision check against buildings
    const collision = scene.children.some(obj => {
      if (!obj.isMesh || !obj.geometry || !obj.geometry.type.includes("Box")) {
        return false;
      }

      if (obj.parent === car.group) return false;

      const box = new THREE.Box3().setFromObject(obj);
      const p = car.group.position;

      return (
        p.x > box.min.x - 1.1 &&
        p.x < box.max.x + 1.1 &&
        p.z > box.min.z - 1.1 &&
        p.z < box.max.z + 1.1 &&
        box.max.y > 1.5
      );
    });

    if (collision) {
      car.group.position.copy(oldPosition);
      car.speed = 0;
    }

    player.position.copy(car.group.position);
    yaw = car.heading;
    modeEl.textContent = "Driving • " + Math.round(Math.abs(car.speed)) + " km/h";
  } else {
    const moving = Math.abs(forwardInput) > 0.08 ||
                   Math.abs(sideInput) > 0.08;

    if (moving) {
      yaw -= sideInput * delta * 2.2;

      const speed = keys["shift"] ? 11 : 6;
      player.position.x -= Math.sin(yaw) * forwardInput * speed * delta;
      player.position.z -= Math.cos(yaw) * forwardInput * speed * delta;

      // Keep player within the world
      player.position.x = THREE.MathUtils.clamp(
        player.position.x, -295, 295
      );
      player.position.z = THREE.MathUtils.clamp(
        player.position.z, -295, 295
      );

      if (character && mixer) {
        const runName = Object.keys(actions).find(name =>
          name.toLowerCase().includes("run")
        );
        const walkName = Object.keys(actions).find(name =>
          name.toLowerCase().includes("walk")
        );

        playAction(runName || walkName || Object.keys(actions)[0]);
      }
    } else if (character && mixer) {
      const idleName = Object.keys(actions).find(name =>
        name.toLowerCase().includes("idle")
      );

      if (idleName) playAction(idleName);
    }

    // Rotate character toward the direction of movement
    player.rotation.y = yaw;

    if (keys[" "] && player.position.y <= 0.01) {
      jumpTime = 0.55;
    }

    if (jumpTime > 0) {
      jumpTime -= delta;
      player.position.y = Math.max(0, Math.sin(
        (jumpTime / 0.55) * Math.PI
      ) * 1.8);
    } else {
      player.position.y = 0;
    }

    modeEl.textContent = "On foot";
  }
}

function updateCamera() {
  const target = activeCar
    ? activeCar.group.position
    : player.position;

  const distance = activeCar ? 10 : 7;
  const height = activeCar ? 4.5 : 3.3;

  const behindX = Math.sin(yaw) * distance;
  const behindZ = Math.cos(yaw) * distance;

  const desired = new THREE.Vector3(
    target.x + behindX,
    target.y + height + pitch * 4,
    target.z + behindZ
  );

  camera.position.lerp(desired, 0.12);

  const lookAt = new THREE.Vector3(
    target.x,
    target.y + (activeCar ? 1.5 : 1.5),
    target.z
  );

  camera.lookAt(lookAt);
}

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);

  updatePlayer(delta);

  if (mixer) mixer.update(delta);

  updateCamera();

  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
document.getElementById("load").style.display = "none";
document.getElementById("notice").style.display = "none";
// ===== END OF GAME CODE =====



</script>
</body>
