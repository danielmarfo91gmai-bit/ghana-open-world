<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Ghana Open World 3D</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#87ceeb;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#hud{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}

.badge{
  background:rgba(0,0,0,.72);
  color:white;
  padding:10px 13px;
  border-radius:12px;
  font-weight:bold;
  font-size:14px;
}

#missionText{
  position:absolute;
  top:65px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.65);
  color:white;
  padding:9px 14px;
  border-radius:10px;
  font-size:13px;
  text-align:center;
}

#controls{
  position:absolute;
  left:0;
  right:0;
  bottom:18px;
  height:150px;
  pointer-events:none;
}

#joystick{
  position:absolute;
  left:22px;
  bottom:15px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  border:2px solid rgba(255,255,255,.35);
  pointer-events:auto;
}

#stick{
  position:absolute;
  left:37px;
  top:37px;
  width:50px;
  height:50px;
  border-radius:50%;
  background:rgba(255,255,255,.75);
}

#buttons{
  position:absolute;
  right:18px;
  bottom:15px;
  display:flex;
  gap:10px;
  pointer-events:auto;
}

.gameButton{
  width:65px;
  height:65px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.68);
  color:white;
  font-size:12px;
  font-weight:bold;
}

#missionButton{
  position:absolute;
  right:20px;
  bottom:90px;
  width:120px;
  height:42px;
  border:0;
  border-radius:12px;
  background:#f5c542;
  color:#111;
  font-weight:bold;
  pointer-events:auto;
}
</style>
</head>

<body>

<div id="game">

<canvas id="gameCanvas"></canvas>

<div id="hud">
  <div class="badge">🇬🇭 GHANA OPEN WORLD</div>
  <div class="badge" id="money">$500</div>
</div>

<div id="missionText">
  Explore the city
</div>

<div id="controls">

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button id="missionButton">
    START MISSION
  </button>

  <div id="buttons">
    <button class="gameButton" id="jumpButton">
      JUMP
    </button>

    <button class="gameButton" id="actionButton">
      ACTION
    </button>
  </div>

</div>

</div>

<script type="importmap">
{
  "imports": {
    "three":
      "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
  }
}
</script>

<script type="module">

import * as THREE from "three";

/* =========================
   BASIC THREE.JS SETUP
========================= */

const canvas =
  document.getElementById("gameCanvas");

const renderer =
  new THREE.WebGLRenderer({
    canvas:canvas,
    antialias:true
  });

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.shadowMap.enabled=true;

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0x87ceeb);

scene.fog =
  new THREE.Fog(0x87ceeb,120,500);


/* =========================
   CAMERA
========================= */

const camera =
  new THREE.PerspectiveCamera(
    60,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
  );

camera.position.set(
  0,
  8,
  12
);


/* =========================
   LIGHT
========================= */

const hemi =
  new THREE.HemisphereLight(
    0xffffff,
    0x557755,
    2
  );

scene.add(hemi);


const sun =
  new THREE.DirectionalLight(
    0xffffff,
    2
  );

sun.position.set(
  100,
  150,
  80
);

sun.castShadow=true;

sun.shadow.mapSize.width=1024;
sun.shadow.mapSize.height=1024;

scene.add(sun);


/* =========================
   MATERIALS
========================= */

const grassMaterial =
  new THREE.MeshStandardMaterial({
    color:0x4d8a45
  });

const roadMaterial =
  new THREE.MeshStandardMaterial({
    color:0x34383d
  });

const buildingMaterial =
  new THREE.MeshStandardMaterial({
    color:0xb9a58e
  });

const roofMaterial =
  new THREE.MeshStandardMaterial({
    color:0x7a3d2d
  });

const treeMaterial =
  new THREE.MeshStandardMaterial({
    color:0x237a38
  });

const trunkMaterial =
  new THREE.MeshStandardMaterial({
    color:0x70452b
  });


/* =========================
   GROUND
========================= */

const ground =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      500,
      500
    ),
    grassMaterial
  );

ground.rotation.x=-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


/* =========================
   ROAD FUNCTION
========================= */

function makeRoad(
  x,
  z,
  width,
  length
){

  const road =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        width,
        .08,
        length
      ),
      roadMaterial
    );

  road.position.set(
    x,
    .04,
    z
  );

  scene.add(road);

}


/* MAIN ROADS */

makeRoad(
  0,
  0,
  24,
  500
);

makeRoad(
  0,
  0,
  500,
  24
);


/* =========================
   ROAD MARKINGS
========================= */

const lineMaterial =
  new THREE.MeshBasicMaterial({
    color:0xf5df55
  });

for(
  let x=-240;
  x<=240;
  x+=30
){

  const line =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        12,
        .1,
        .7
      ),
      lineMaterial
    );

  line.position.set(
    x,
    .11,
    0
  );

  scene.add(line);

}


for(
  let z=-240;
  z<=240;
  z+=30
){

  const line =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .7,
        .1,
        12
      ),
      lineMaterial
    );

  line.position.set(
    0,
    .11,
    z
  );

  scene.add(line);

}


/* =========================
   BUILDINGS
========================= */

function makeBuilding(
  x,
  z,
  w,
  h,
  d
){

  const building =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,
        h,
        d
      ),
      buildingMaterial
    );

  building.position.set(
    x,
    h/2,
    z
  );

  building.castShadow=true;
  building.receiveShadow=true;

  scene.add(building);


  const roof =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w+1,
        .6,
        d+1
      ),
      roofMaterial
    );

  roof.position.set(
    x,
    h+.3,
    z
  );

  roof.castShadow=true;

  scene.add(roof);

}


/* CITY BLOCKS */

const buildings = [

 [-55,-55,25,28,25],
 [55,-55,30,35,25],

 [-55,55,28,22,28],
 [55,55,24,30,30],

 [-95,-20,25,18,25],
 [95,20,30,25,25],

 [-95,35,20,20,22],
 [95,-35,22,32,25],

 [-140,-80,35,45,30],
 [140,80,35,38,30],

 [-150,60,25,25,25],
 [150,-60,30,28,25]

];

for(
  const b of buildings
){

  makeBuilding(
    b[0],
    b[1],
    b[2],
    b[3],
    b[4]
  );

}


/* =========================
   TREES
========================= */

function makeTree(
  x,
  z
){

  const trunk =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        .8,
        1,
        5,
        8
      ),
      trunkMaterial
    );

  trunk.position.set(
    x,
    2.5,
    z
  );

  trunk.castShadow=true;

  scene.add(trunk);


  const leaves =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        4,
        12,
        12
      ),
      treeMaterial
    );

  leaves.position.set(
    x,
    7,
    z
  );

  leaves.castShadow=true;

  scene.add(leaves);

}


for(
  let x=-180;
  x<=180;
  x+=30
){

  makeTree(
    x,
    -35
  );

  makeTree(
    x,
    35
  );

}


/* =========================
   PLAYER
========================= */

const player =
  new THREE.Group();

scene.add(player);


/* body */

const body =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      1.5,
      2.2,
      1
    ),
    new THREE.MeshStandardMaterial({
      color:0x263b63
    })
  );

body.position.y=2.2;

body.castShadow=true;

player.add(body);


/* head */

const head =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .65,
      16,
      16
    ),
    new THREE.MeshStandardMaterial({
      color:0xb8794b
    })
  );

head.position.y=3.8;

head.castShadow=true;

player.add(head);


/* legs */

function makeLeg(
  x
){

  const leg =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .5,
        1.8,
        .6
      ),
      new THREE.MeshStandardMaterial({
        color:0x172033
      })
    );

  leg.position.set(
    x,
    .9,
    0
  );

  leg.castShadow=true;

  player.add(leg);

}

makeLeg(-.45);
makeLeg(.45);


/* =========================
   PLAYER STATE
========================= */

player.position.set(
  0,
  0,
  15
);

let playerSpeed=0.18;

let moveForward=0;
let moveSide=0;

let missionActive=false;


/* =========================
   MISSION MARKER
========================= */

const marker =
  new THREE.Mesh(
    new THREE.TorusGeometry(
      3,
      .3,
      12,
      32
    ),
    new THREE.MeshBasicMaterial({
      color:0x2196ff
    })
  );

marker.rotation.x=
  Math.PI/2;

marker.position.set(
  40,
  .2,
  -40
);

scene.add(marker);


/* =========================
   JOYSTICK
========================= */

const joystick =
  document.getElementById(
    "joystick"
  );

const stick =
  document.getElementById(
    "stick"
  );

let joystickActive=false;

let joyX=0;
let joyY=0;


function updateJoystick(
  e
){

  const rect =
    joystick.getBoundingClientRect();

  const centerX =
    rect.left+rect.width/2;

  const centerY =
    rect.top+rect.height/2;

  let dx=e.clientX-centerX;
  let dy=e.clientY-centerY;

  const max=40;

  const distance =
    Math.sqrt(
      dx*dx+dy*dy
    );

  if(distance>max){

    dx=
      dx/distance*max;

    dy=
      dy/distance*max;

  }

  stick.style.transform=
    `translate(${dx}px,${dy}px)`;

  joyX=dx/max;
  joyY=dy/max;

}


joystick.addEventListener(
  "pointerdown",
  e=>{

    joystickActive=true;

    joystick.setPointerCapture(
      e.pointerId
    );

    updateJoystick(e);

  }
);


joystick.addEventListener(
  "pointermove",
  e=>{

    if(joystickActive){

      updateJoystick(e);

    }

  }
);


joystick.addEventListener(
  "pointerup",
  e=>{

    joystickActive=false;

    joyX=0;
    joyY=0;

    stick.style.transform=
      "translate(0,0)";

  }
);


/* =========================
   MISSION BUTTON
========================= */

const missionButton =
  document.getElementById(
    "missionButton"
  );

const missionText =
  document.getElementById(
    "missionText"
  );


missionButton.onclick=()=>{

  missionActive=
    !missionActive;

  if(missionActive){

    missionButton.textContent=
      "MISSION ACTIVE";

    missionText.textContent=
      "Go to the blue marker";

  }else{

    missionButton.textContent=
      "START MISSION";

    missionText.textContent=
      "Explore the city";

  }

};


/* =========================
   ACTION BUTTON
========================= */

document
.getElementById("actionButton")
.onclick=()=>{

  missionText.textContent=
    "Action button pressed!";

  setTimeout(()=>{

    missionText.textContent=
      missionActive
      ? "Go to the blue marker"
      : "Explore the city";

  },1500);

};


/* =========================
   JUMP
========================= */

let jumping=false;

document
.getElementById("jumpButton")
.onclick=()=>{

  if(jumping)return;

  jumping=true;

  const startY=
    player.position.y;

  let t=0;

  function jump(){

    t+=.08;

    player.position.y=
      startY+
      Math.sin(t*Math.PI)*3;

    if(t<1){

      requestAnimationFrame(jump);

    }else{

      player.position.y=
        startY;

      jumping=false;

    }

  }

  jump();

};


/* =========================
   KEYBOARD
========================= */

const keys={};

window.addEventListener(
  "keydown",
  e=>{
    keys[e.key.toLowerCase()]=true;
  }
);

window.addEventListener(
  "keyup",
  e=>{
    keys[e.key.toLowerCase()]=false;
  }
);


/* =========================
   GAME UPDATE
========================= */

function update(){

  let forward=
    -joyY;

  let side=
    joyX;


  if(keys["w"]||
     keys["arrowup"]){

    forward=1;

  }

  if(keys["s"]||
     keys["arrowdown"]){

    forward=-1;

  }

  if(keys["a"]||
     keys["arrowleft"]){

    side=-1;

  }

  if(keys["d"]||
     keys["arrowright"]){

    side=1;

  }


  if(
    forward!==0 ||
    side!==0
  ){

    const length=
      Math.sqrt(
        forward*forward+
        side*side
      );

    forward/=length;
    side/=length;


    player.position.z+=
      forward*
      playerSpeed;

    player.position.x+=
      side*
      playerSpeed;


    player.rotation.y=
      Math.atan2(
        side,
        forward
      );

  }


  /* keep player in city */

  player.position.x=
    THREE.MathUtils.clamp(
      player.position.x,
      -220,
      220
    );

  player.position.z=
    THREE.MathUtils.clamp(
      player.position.z,
      -220,
      220
    );


  /* marker animation */

  marker.rotation.z+=.03;

}


/* =========================
   CAMERA FOLLOW
========================= */

function updateCamera(){

  const desired =
    new THREE.Vector3(
      player.position.x,
      player.position.y+8,
      player.position.z+12
    );

  camera.position.lerp(
    desired,
    .08
  );

  const target =
    new THREE.Vector3(
      player.position.x,
      player.position.y+2,
      player.position.z
    );

  camera.lookAt(target);

}


/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      window.innerWidth/
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


/* =========================
   GAME LOOP
========================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  update();

  updateCamera();

  renderer.render(
    scene,
    camera
  );

}

animate();

</script>

</body>
</html>
